networks:
  borysovskaoa_knowledge_hub_network:
    driver: bridge
services:
  vectordb:
    container_name: qdrant_db
    networks:
      - borysovskaoa_knowledge_hub_network
    image: qdrant/qdrant:v1.9.2
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - '6333:6333'
    healthcheck:
      test:
        - 'CMD-SHELL'
        - "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"200 OK\"'"
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
  db:
    container_name: postgres_db
    networks:
      - borysovskaoa_knowledge_hub_network
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
  adminer:
    container_name: adminer
    networks:
      - borysovskaoa_knowledge_hub_network
    image: adminer:5.4.2
    profiles:
      - dev
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      - ADMINER_DEFAULT_SERVER=db
    depends_on:
      - db
  app:
    container_name: knowledge_hub
    networks:
      - borysovskaoa_knowledge_hub_network
    build:
      context: .
      target: production
    restart: on-failure
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public&connection_limit=5&pool_timeout=10
      - PORT=${PORT}
      - SALT_ROUNDS=${SALT_ROUNDS}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_SECRET_REFRESH_KEY=${JWT_SECRET_REFRESH_KEY}
      - TOKEN_EXPIRE_TIME=${TOKEN_EXPIRE_TIME}
      - TOKEN_REFRESH_EXPIRE_TIME=${TOKEN_REFRESH_EXPIRE_TIME}
      - RATE_LIMIT_TTL=${RATE_LIMIT_TTL}
      - RATE_LIMIT=${RATE_LIMIT}
      - RATE_LIMIT_AUTH=${RATE_LIMIT_AUTH}
      - RATE_LIMIT_AI=${RATE_LIMIT_AI}
      - CACHE_TTL=${CACHE_TTL}
      - CACHE_TTL_AI=${CACHE_TTL_AI}
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_MAX_FILE_SIZE=${LOG_MAX_FILE_SIZE}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL}
      - GEMINI_MODEL_EMBEDDING=${GEMINI_MODEL_EMBEDDING}
      - RAG_VECTOR_DB_PROVIDER=${RAG_VECTOR_DB_PROVIDER}
      - RAG_VECTOR_DB_URL=http://vectordb:6333
      - RAG_VECTOR_COLLECTION=${RAG_VECTOR_COLLECTION}
      - RAG_CHUNK_SIZE=${RAG_CHUNK_SIZE}
      - RAG_CHUNK_OVERLAP=${RAG_CHUNK_OVERLAP}
      - RAG_CONVERSATION_MAX_MESSAGES=${RAG_CONVERSATION_MAX_MESSAGES}
    ports:
      - '${PORT}:4000'
    volumes:
      - ./logs:/app/logs
    command: >
      sh -c "npx prisma migrate deploy && npm run start:prod"
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:4000/health || exit 1']
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    depends_on:
      db:
        condition: service_healthy
      vectordb:
        condition: service_healthy

volumes:
  postgres-data:
  qdrant-data:
